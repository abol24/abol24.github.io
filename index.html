
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="b2955a5397e25a4335a8716ede88a62aeaa8e8de" content="b2955a5397e25a4335a8716ede88a62aeaa8e8de" />

    <title>Snowy Snake ❄️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 45px 30px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 42px;
        }

        p {
            margin: 0 0 30px;
            color: #dceff7;
            font-size: 17px;
        }

        .play-button {
            display: inline-block;
            padding: 15px 38px;
            border-radius: 50px;
            background: white;
            color: #173847;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .play-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🐍❄️</div>

        <h1>Snowy Snake</h1>

        <p>
            A fun and chilly snake game.
            How long can you survive?
        </p>

        <a
            class="play-button"
            href="https://abol24.github.io/Snowy-Snake/">
            ▶ Play Snowy Snake
        </a>

        <div class="footer">
            © 2026 Snowy Snake
        </div>

    </div>

</body>
</html>
